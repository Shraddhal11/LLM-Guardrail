version: '3.8'

services:
  pii-governance-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pii-governance-proxy
    restart: always
    ports:
      - "8000:8000"
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
